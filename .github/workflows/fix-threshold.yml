name: Rett terskelverdier

# Kjører fix-threshold.js mot Garmin når threshold-fix.json endres. Samme
# sikring som fix-strength.yml: uten "apply": true i fila er kjøringen en
# tørrkjøring som bare viser diffen i loggen. Dette skriver til profilinnstillinger
# som styrer alle pulssoner, all intensitetsfordeling og alle løpsprediksjoner,
# så terskelen for å sende er med vilje høy.
on:
  push:
    paths:
      - 'threshold-fix.json'
      - 'fix-threshold.js'
  workflow_dispatch: {}

permissions:
  contents: write # trengs for å committe sikkerhetskopien av user-settings

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Rett terskelen
        env:
          GARMIN_OAUTH1_TOKEN: ${{ secrets.GARMIN_OAUTH1_TOKEN }}
          GARMIN_OAUTH2_TOKEN: ${{ secrets.GARMIN_OAUTH2_TOKEN }}
        run: node fix-threshold.js

      # Sikkerhetskopien av user-settings tas før skriving og er eneste vei
      # tilbake om PUT-en skulle gjøre mer enn den ble bedt om. Den hører hjemme
      # i repoet, ikke i en kjørelogg som slettes etter 90 dager.
      - name: Commit sikkerhetskopien
        run: |
          if [ -n "$(git status --porcelain data/backup)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add data/backup
            git commit -m 'Sikkerhetskopi av user-settings før terskelretting'
            git push
          else
            echo 'Ingen sikkerhetskopi skrevet (tørrkjøring).'
          fi
